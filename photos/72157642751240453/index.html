	<h1>Photo album: Kaua&#39;i</h1>
	<span class="nif-icon nif-icon-camera-retro"></span>
</header>
	
	<div id="content">
		<p>Kaua&#39;i is known as &quot;the garden isle&quot; and is one of the oldest of the Hawaiian islands. </p>
<p>We visited the Na Pali Coast, Waimea Canyon and surfed the waves of Hanalei Bay.</p>
